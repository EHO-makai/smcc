id: DEC-011
type: Decision
schema_version: 1
version: 1
status: accepted
title: Git integration is Level 1 provenance only
statement: >-
  SMCC records Git provenance (base commit, resulting commit, changed files,
  diff reference) but Git commits are not the transactional mechanism for
  SMCC state. A commit does not constitute task acceptance or
  authoritative-state acceptance.
