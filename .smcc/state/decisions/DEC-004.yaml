id: DEC-004
type: Decision
schema_version: 1
version: 1
status: accepted
title: Compiled-context provenance lives in YAML frontmatter
statement: >-
  Compiled Markdown contexts include YAML frontmatter recording task id and
  version, compiler version, the (id, version) of every authoritative state
  object consumed, dependency result ids, a content_hash, and a compiled_at
  timestamp. No separate context-manifest file in v1.
