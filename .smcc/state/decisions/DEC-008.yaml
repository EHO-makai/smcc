id: DEC-008
type: Decision
schema_version: 1
version: 1
status: accepted
title: Proposal atomicity and operations
statement: >-
  One Proposal represents one change to one authoritative state object; a
  task Result may produce zero or more Proposals, each independently
  accepted or rejected. Proposal operations distinguish create, update, and
  supersede. Acceptance of an update verifies the expected current object
  version and produces exactly the next version. No grouped transactions or
  partial acceptance in v1.
