id: CON-003
type: Constraint
schema_version: 1
version: 2
status: accepted
scope: project
title: Context selection is explicit only in v1
statement: >-
  Do not implement automatic relevance inference, tag matching, embeddings,
  semantic search, or LLM-selected context. Compiled context contains only:
  the task itself; its acceptance criteria and task-local constraints; the
  project goal; project-scoped constraints; objects named by the task's
  context_refs; and the accepted Result of each task dependency, as named
  by that task's accepted_result field.
