test_results:
  - 67 passed in 11.89s; acceptance criteria covered directly (identical hash on recompile with differing compiled_at, frontmatter matches rendered consumption exactly, selection-set membership and exclusion, stable ordering, version bump changes hash with the changed input identifiable as the state_refs delta).
  - smcc validate exits 0; smcc compile TASK-003 wrote the content-addressed context.
findings:
  - Content addressing by content_hash makes write idempotence trivial and collision-safe - a same-named file is by construction the same context, so no overwrite handling is needed.
  - Retired project-scoped constraints are excluded from the always-include rule (they are no longer authoritative); an explicitly named retired object via context_refs is still included because explicit naming wins. CON-003 does not state this; flagged below.
  - Windows forbids colons in filenames, so content_hash is bare hex with no algorithm prefix; the algorithm is fixed by compiler_version.
  - Living-fixture lesson (fourth occurrence) - flipping TASK-003 to in_progress broke a validate drift test that relied on the live fixture's status; the test now seeds its own statuses.
unresolved_questions:
  - Should the always-include rule for project-scoped constraints filter by status (current behavior excludes retired, includes draft and accepted), and should CON-003 be amended to say so?
  - Staleness detection (DEC-005) has defined semantics and identifiable inputs via state_refs, but no checker exists yet; is that a validate extension or a separate smcc command?
