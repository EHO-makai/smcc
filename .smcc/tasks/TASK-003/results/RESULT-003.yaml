summary: >-
  Implemented the deterministic context compiler: compile_context builds the
  explicit CON-003 selection set from a snapshot, renders a stable-ordered
  Markdown context package with DEC-004 YAML provenance frontmatter, and
  computes a sha256 content_hash over canonical content excluding volatile
  fields (DEC-005). write_context stores the package content-addressed under
  .smcc/contexts/<task-id>/<content_hash>.md. The compiler compiled its own
  task's context, which is committed per DEC-006. 67 tests pass.
work_performed:
  - Implemented src/smcc/compile.py - compile_context(snapshot, task_id) resolves the CON-003 selection set (task, acceptance criteria, task-local constraints, project goal_refs, project-scoped constraints, context_refs, accepted dependency Results via accepted_result), deduped by id; CompileError on unknown task, dangling refs, non-state context_refs, or a dependency without an accepted result.
  - Markdown rendering per ARCHITECTURE section 9.2 - stable section order, objects sorted by id within sections, empty headings omitted; dependency Results render summary, findings, and unresolved questions.
  - Provenance frontmatter per DEC-004 - task id/version, compiler_version (0.1), sorted (id, version) state_refs, dependency (task_id, result_id) pairs, content_hash, compiled_at.
  - content_hash per DEC-005 - sha256 over canonical YAML of the non-volatile frontmatter fields plus the body; compiled_at and content_hash excluded, so recompilation of unchanged inputs is hash-identical.
  - write_context - content-addressed exclusive-create write; an existing file with the same hash already holds identical content, so rewrite is a no-op.
  - Implemented smcc compile TASK-NNN CLI subcommand with --smcc-dir and upward discovery, printing the written path and content_hash; exit 0/1/2 consistent with validate.
  - Compiled TASK-003's own context and committed it (first real compiled context, hash e23ff922...).
