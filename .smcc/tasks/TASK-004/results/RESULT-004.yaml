  - smcc validate (live sidecar)
  - smcc stale TASK-003 and smcc stale TASK-004 (live sidecar)
test_results:
  - 76 passed in 15.75s; acceptance criteria covered directly (fresh on unchanged inputs; bumped state version identified with recorded and current versions; changed dependency accepted_result identified; deleted input reported missing; own-task version drift identified; CLI exit 0 fresh / 1 stale or no contexts with named inputs in output). One live-fixture test asserts the committed TASK-003 context is stale due to CON-003 drift.
  - smcc stale TASK-003 exits 1 reporting "TASK-003 recorded v5, current v7" and "CON-003 recorded v2, current v3" - a genuine staleness case produced by the PR #3 review amendment, not a synthetic fixture.
  - smcc stale TASK-004 exits 0 reporting the freshly compiled context as fresh; smcc validate exits 0.
findings:
  - The committed TASK-003 context being genuinely stale (CON-003 amended during its own PR review) gave the checker a real-world test case on day one; committed contexts per DEC-006 create exactly the audit trail staleness detection needs.
  - Dependency staleness compares only the recorded result id against the dependency's current accepted_result; the dependency task's own version drift is deliberately not reported for the consuming context, since DEC-005 makes the accepted Result the consumed input, not the dependency task object.
  - Living-fixture lessons (sixth and seventh occurrences) - adding TASK-004 to the live sidecar broke a store test asserting an exact task id list and an exact constraint count; census assertions over the living fixture must be growth-tolerant (supersets and minimums, never exact).
  - Staleness is a read-only query, so it fits a separate smcc stale command rather than a validate extension - validate checks snapshot invariants, stale compares an artifact against the snapshot. This resolves RESULT-003's second unresolved question.
unresolved_questions:
  - smcc stale exits 0 when at least one context for the task is fresh; should a future recompile-on-stale workflow instead key off the newest context only?
