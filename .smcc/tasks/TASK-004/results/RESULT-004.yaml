summary: >-
  Implemented staleness detection per DEC-005: check_context parses a compiled
  context's DEC-004 provenance frontmatter and compares every recorded input
  (task version, state-object versions, dependency accepted results) against
  the current authoritative snapshot, reporting each changed input with its
  recorded and current values. check_task_contexts checks all stored contexts
  for a task; the smcc stale CLI subcommand reports fresh/stale per context
  and exits 0 only when at least one fresh context exists. The checker was
  run against the live sidecar and correctly identified the committed
  TASK-003 context as stale from the real CON-003 v2->v3 amendment and
  TASK-003 v5->v7 acceptance. 76 tests pass. This is the first task executed
  against an SMCC-compiled context (context_source: compiled).
work_performed:
  - Implemented StaleInput (kind task|state|dependency, id, recorded, current) and StalenessReport (path, task_id, content_hash, stale_inputs, fresh property) frozen dataclasses in src/smcc/compile.py.
  - check_context(snapshot, document, path) parses provenance frontmatter and flags - own-task version drift, state_refs version drift, state_refs entries that no longer resolve (reported as missing), dependency accepted_result mismatch (a cleared accepted_result reports current as none; a missing dependency task as missing). Malformed or missing frontmatter raises CompileError.
  - check_task_contexts(smcc_dir, snapshot, task_id) checks every .smcc/contexts/<task-id>/*.md in stable sorted order.
  - 'Implemented smcc stale TASK-NNN CLI subcommand with --smcc-dir and upward discovery; prints "<path>: fresh" or "<path>: stale" plus one indented line per stale input ("ID: recorded vN, current vM"); exit 0 if at least one context is fresh, 1 if all stale or none exist, 2 on usage errors - consistent with validate and compile.'
  - Exported StaleInput, StalenessReport, check_context, check_task_contexts from the smcc package.
  - Compiled TASK-004's own context (cc4ef3a1...) before implementation and worked from it - first SMCC-compiled context driving an SMCC task (section 5 bootstrap progression).
